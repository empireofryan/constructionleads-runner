name: daily-report
# Runs the PRIVATE repo empireofryan/ConstructionLeads' daily permit report on this PUBLIC
# repo's free Actions minutes. The private repo is checked out with a write deploy key scoped
# to that repo only; reports are committed back there. Script output stays out of these logs.
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 5:00 AM Phoenix (no DST in AZ)
  workflow_dispatch:
concurrency: { group: daily-report, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: empireofryan/ConstructionLeads
          ssh-key: ${{ secrets.CL_DEPLOY_KEY }}
          path: app
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund > /dev/null
      - name: Ingest permits and build report (output kept out of the public log)
        working-directory: app
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env.local
          node scripts/ingest-phoenix.mjs --since 3 > ../run.log 2>&1 || { echo "Ingest failed"; exit 1; }
          node scripts/daily-report.mjs >> ../run.log 2>&1 || { echo "Report failed"; exit 1; }
          rm -f .env.local
          echo "Report built."
      - name: Commit report back to the private repo
        working-directory: app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "No new report." || { git commit -qm "daily report $(date -u +%F)"; git push -q; echo "Report pushed."; }
